[project]
name = "khitmee_ops"
authors = [
    { name = "Khitmee", email = "admin@example.invalid" }
]
description = "Khitmee counter operations and fast ERPNext reports"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.60.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["tests"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = [
    "B017",
    "B018",
    "B023",
    "B904",
    "E101",
    "E402",
    "E501",
    "E741",
    "F401",
    "F403",
    "F405",
    "F722",
    "W191",
    "RUF001",
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true

[tool.vulture]
paths = ["khitmee_ops"]
min_confidence = 80
ignore_decorators = ["@frappe.whitelist", "@frappe.whitelist()", "@click.command", "@click.option", "@click.argument"]
ignore_names = ["get_context", "execute", "after_install", "commands"]
