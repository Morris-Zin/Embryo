[package]
name = "khitmee-print-companion"
version = "0.1.0"
edition = "2021"
description = "Tiny local HTTP print companion for Khitmee ERPNext vouchers"
license = "MIT"

[dependencies]
tiny_http = "0.12.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
toml = "0.8.20"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59.0", features = [
  "Win32_Foundation",
  "Win32_Graphics_Printing",
  "Win32_Graphics_Gdi",
  "Win32_Security",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
