name: Oracle parity

# The live ERPNext oracle gate needs the khitmee-perf stack and a year of seeded
# data (~90 min), so it does not run per pull request.  It runs nightly and on
# demand on a self-hosted runner labelled `khitmee-perf`, and only for the
# default branch: fork pull requests and unmerged branches never reach that
# machine.  Set the repository variable KHITMEE_PERF_RUNNER=true once the runner
# is registered; until then the job is skipped, not failed.

on:
  schedule:
    - cron: "30 19 * * *"
  workflow_dispatch:
    inputs:
      gp_1y:
        description: "1-year stock oracle cases"
        required: true
        type: choice
        options:
          - warehouse
          - all
          - none
        default: warehouse

permissions:
  contents: read

concurrency:
  group: khitmee-perf-oracle
  cancel-in-progress: false

jobs:
  integration-oracle-gate:
    name: Integration oracle gate
    if: >-
      vars.KHITMEE_PERF_RUNNER == 'true' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, khitmee-perf]
    timeout-minutes: 240
    env:
      # Passed through the environment, never interpolated into shell source.
      GP_1Y: ${{ inputs.gp_1y || 'warehouse' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate inputs
        run: |
          case "$GP_1Y" in
            warehouse|all|none) ;;
            *) echo "invalid gp_1y" >&2; exit 2 ;;
          esac

      # The gate runs against the perf backend's mounted app, so sync this
      # checkout into it first; otherwise the gate would test stale code.
      - name: Sync checkout into the perf stack
        run: bash perf-suite/scripts/up.sh --profile 2gb --with-khitmee-ops

      # Fail-closed: tools/perf_parity.py --require-db exits non-zero when the bench
      # database is unavailable, executed_cases == 0, skipped_cases > 0, or
      # failed_cases > 0.
      - name: Run required ERPNext oracle parity suite
        run: python3 tools/perf_parity.py --require-db --profile 2gb --gp-1y "$GP_1Y"
