name: Autoloop Comment Refresh

on:
  issue_comment:
    types:
      - created
      - edited
      - deleted

permissions:
  actions: write
  issues: read
  pull-requests: read

jobs:
  refresh-bound-pr-gate:
    name: refresh-bound-pr-gate
    if: github.event.comment.user.login == 'Morris-Zin'
    runs-on: ubuntu-latest
    steps:
      - name: Re-run Autoloop Gate for bound PR on authoritative comment change
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_SLUG: ${{ github.repository }}
          EVENT_ACTION: ${{ github.event.action }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          IS_PR_COMMENT: ${{ github.event.issue.pull_request != null }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, time, urllib.error, urllib.request

          event_path = os.environ["GITHUB_EVENT_PATH"]
          event = json.load(open(event_path, encoding="utf-8"))
          comment_body = str((event.get("comment") or {}).get("body") or "")
          prev_body = str(((event.get("changes") or {}).get("body") or {}).get("from") or "")
          combined_body = comment_body + "\n" + prev_body
          action = os.environ.get("EVENT_ACTION") or ""
          is_pr = os.environ.get("IS_PR_COMMENT") == "true"
          repo = os.environ["REPO_SLUG"]
          token = os.environ["GH_TOKEN"]

          pr_markers = (
              "autoloop-contract:v1",
              "autoloop-review:v1",
              "autoloop-rule-edit-approval:v1",
              "autoloop-auto-merge-approval:v1",
              "autoloop-findings:v1",
          )
          issue_markers = ("autoloop-contract:v1",)
          relevant_markers = pr_markers if is_pr else issue_markers

          if not is_pr and not any(m in combined_body for m in issue_markers):
              print("Ignoring non-contract issue comment.")
              raise SystemExit(0)
          if action == "created" and not any(m in combined_body for m in relevant_markers):
              print("Ignoring ordinary non-autoloop PR comment.")
              raise SystemExit(0)

          pr_numbers = set()
          if is_pr:
              pr_numbers.add(int(os.environ["ISSUE_NUMBER"]))
          else:
              for m in re.finditer(r"Bound PR:\s*#(\d+)", combined_body):
                  pr_numbers.add(int(m.group(1)))
              for m in re.finditer(r'"pr_number"\s*:\s*(\d+)', combined_body):
                  pr_numbers.add(int(m.group(1)))

          if not pr_numbers:
              print("No bound PR referenced by comment; nothing to refresh.")
              raise SystemExit(0)

          def api(path, method="GET"):
              req = urllib.request.Request(
                  f"https://api.github.com{path}",
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "User-Agent": "autoloop-comment-refresh",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req, timeout=20) as resp:
                  body = resp.read().decode("utf-8")
                  return json.loads(body) if body.strip() else {}

          def find_pr_gate_run(pr_obj):
              pr_num = int(pr_obj["number"])
              head = pr_obj.get("head") or {}
              head_sha = head.get("sha") or ""
              head_ref = head.get("ref") or ""
              head_repo_full = ((head.get("repo") or {}).get("full_name") or "").lower()
              head_owner = ((head.get("user") or {}).get("login") or "")

              unassociated_candidates = []
              page = 1
              while page <= 5:
                  runs_data = api(
                      f"/repos/{repo}/actions/workflows/autoloop-gate.yml/runs?head_sha={head_sha}&per_page=100&page={page}"
                  )
                  runs = runs_data.get("workflow_runs") or []
                  if not runs:
                      break
                  for run in runs:
                      prs = run.get("pull_requests") or []
                      if any(int(p.get("number") or 0) == pr_num for p in prs if isinstance(p, dict)):
                          return run
                      # GitHub may omit `pull_requests` on fork PR runs; collect matching head repo/branch candidates.
                      if not prs and run.get("event") in ("pull_request", "pull_request_review"):
                          run_repo = ((run.get("head_repository") or {}).get("full_name") or "").lower()
                          if run.get("head_branch") == head_ref and (not head_repo_full or run_repo == head_repo_full):
                              unassociated_candidates.append(run)
                  if len(runs) < 100:
                      break
                  page += 1

              if unassociated_candidates and head_owner and head_ref:
                  # Only accept an unassociated fork run when THIS PR is the sole open PR for head_owner:head_ref.
                  open_same_head = api(
                      f"/repos/{repo}/pulls?state=open&head={head_owner}:{head_ref}&per_page=10"
                  )
                  matching_open = [
                      p for p in (open_same_head or [])
                      if (p.get("head") or {}).get("sha") == head_sha
                  ]
                  if len(matching_open) == 1 and int(matching_open[0].get("number") or 0) == pr_num:
                      return unassociated_candidates[0]
              return None

          for pr_num in sorted(pr_numbers):
              pr = api(f"/repos/{repo}/pulls/{pr_num}")
              if pr.get("state") != "open":
                  print(f"Skipping non-open PR #{pr_num}.")
                  continue
              head_sha = (pr.get("head") or {}).get("sha") or ""
              if not head_sha:
                  continue
              target = find_pr_gate_run(pr)
              if target is None:
                  print(f"No unambiguous Autoloop Gate run matched PR #{pr_num} at head {head_sha[:8]}; refusing rerun.")
                  continue
              run_id = target["id"]
              if target.get("status") != "completed":
                  print(f"Cancelling active Autoloop Gate run {run_id} for PR #{pr_num} so rerun observes updated comment.")
                  try:
                      api(f"/repos/{repo}/actions/runs/{run_id}/cancel", method="POST")
                  except urllib.error.HTTPError as exc:
                      print(f"Cancel returned HTTP {exc.code}; waiting for run completion.")
                  completed = False
                  # Wait up to GitHub's documented 5-minute cancellation window for confirmed completion.
                  for _ in range(60):
                      time.sleep(5)
                      refreshed = api(f"/repos/{repo}/actions/runs/{run_id}")
                      if refreshed.get("status") == "completed":
                          completed = True
                          break
                  if not completed:
                      raise SystemExit(
                          f"ERROR: Autoloop Gate run {run_id} for PR #{pr_num} did not finish cancelling within 300s"
                      )
              print(f"Re-running Autoloop Gate run {run_id} for PR #{pr_num} head {head_sha[:8]}.")
              last_err = None
              for attempt in range(6):
                  try:
                      api(f"/repos/{repo}/actions/runs/{run_id}/rerun", method="POST")
                      last_err = None
                      break
                  except urllib.error.HTTPError as exc:
                      if exc.code in (403, 409, 422):
                          last_err = exc
                          time.sleep(5)
                          continue
                      raise
              if last_err is not None:
                  raise last_err
          PY
