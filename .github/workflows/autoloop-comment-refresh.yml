name: Autoloop Comment Refresh

on:
  issue_comment:
    types:
      - created
      - edited
      - deleted

permissions:
  actions: write
  issues: read
  pull-requests: read

jobs:
  refresh-bound-pr-gate:
    name: refresh-bound-pr-gate
    if: github.event.comment.user.login == 'Morris-Zin'
    runs-on: ubuntu-latest
    steps:
      - name: Re-run Autoloop Gate for bound PR on authoritative comment change
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_SLUG: ${{ github.repository }}
          EVENT_ACTION: ${{ github.event.action }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          IS_PR_COMMENT: ${{ github.event.issue.pull_request != null }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, urllib.request

          event_path = os.environ["GITHUB_EVENT_PATH"]
          event = json.load(open(event_path, encoding="utf-8"))
          comment_body = str((event.get("comment") or {}).get("body") or "")
          prev_body = str(((event.get("changes") or {}).get("body") or {}).get("from") or "")
          combined_body = comment_body + "\n" + prev_body
          action = os.environ.get("EVENT_ACTION") or ""
          is_pr = os.environ.get("IS_PR_COMMENT") == "true"
          repo = os.environ["REPO_SLUG"]
          token = os.environ["GH_TOKEN"]

          markers = (
              "autoloop-contract:v1",
              "autoloop-review:v1",
              "autoloop-rule-edit-approval:v1",
              "autoloop-auto-merge-approval:v1",
              "autoloop-findings:v1",
          )
          if not any(m in combined_body for m in markers) and not is_pr:
              print("Ignoring ordinary non-autoloop issue comment.")
              raise SystemExit(0)
          if action == "created" and not any(m in combined_body for m in markers):
              print("Ignoring ordinary non-autoloop PR comment.")
              raise SystemExit(0)

          pr_numbers = set()
          if is_pr:
              pr_numbers.add(int(os.environ["ISSUE_NUMBER"]))
          for m in re.finditer(r"Bound PR:\s*#(\d+)", combined_body):
              pr_numbers.add(int(m.group(1)))
          for m in re.finditer(r'"pr_number"\s*:\s*(\d+)', combined_body):
              pr_numbers.add(int(m.group(1)))
          for m in re.finditer(r"\bpr=(\d+)\b", combined_body):
              pr_numbers.add(int(m.group(1)))

          if not pr_numbers:
              print("No bound PR referenced by comment; nothing to refresh.")
              raise SystemExit(0)

          def api(path, method="GET"):
              req = urllib.request.Request(
                  f"https://api.github.com{path}",
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "User-Agent": "autoloop-comment-refresh",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req, timeout=20) as resp:
                  body = resp.read().decode("utf-8")
                  return json.loads(body) if body.strip() else {}

          for pr_num in sorted(pr_numbers):
              pr = api(f"/repos/{repo}/pulls/{pr_num}")
              if pr.get("state") != "open":
                  print(f"Skipping non-open PR #{pr_num}.")
                  continue
              head_sha = (pr.get("head") or {}).get("sha") or ""
              if not head_sha:
                  continue
              runs_data = api(
                  f"/repos/{repo}/actions/workflows/autoloop-gate.yml/runs?head_sha={head_sha}&per_page=5"
              )
              runs = runs_data.get("workflow_runs") or []
              if not runs:
                  print(f"No Autoloop Gate run found for PR #{pr_num} head {head_sha[:8]}.")
                  continue
              latest = runs[0]
              run_id = latest["id"]
              if latest.get("status") != "completed":
                  print(f"Autoloop Gate run {run_id} for PR #{pr_num} is already {latest.get('status')}; skipping rerun.")
                  continue
              print(f"Re-running Autoloop Gate run {run_id} for PR #{pr_num} head {head_sha[:8]}.")
              api(f"/repos/{repo}/actions/runs/{run_id}/rerun", method="POST")
          PY
