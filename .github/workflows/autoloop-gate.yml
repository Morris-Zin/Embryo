name: Autoloop Gate

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
      - labeled
      - unlabeled
  pull_request_review:
    types:
      - submitted
      - edited
      - dismissed

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  autoloop-preflight:
    name: autoloop-preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      enrolled: ${{ steps.gate.outputs.enrolled }}
      bootstrap: ${{ steps.gate.outputs.bootstrap }}
      run_id: ${{ steps.gate.outputs.run_id }}
      code_tree_sha256: ${{ steps.gate.outputs.code_tree_sha256 }}
      shard_checks_b64: ${{ steps.gate.outputs.shard_checks_b64 }}
      shard_checks_sha256: ${{ steps.gate.outputs.shard_checks_sha256 }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch PR base, main, and PR head ref
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" fetch --no-tags origin \
            "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}" \
            "${BASE_SHA}" \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr-${PR_NUMBER}-head"
          ACTUAL_HEAD="$(git rev-parse "refs/remotes/origin/pr-${PR_NUMBER}-head")"
          if [ "${ACTUAL_HEAD}" != "${HEAD_SHA}" ]; then
            echo "ERROR: refs/pull/${PR_NUMBER}/head (${ACTUAL_HEAD}) != event head.sha (${HEAD_SHA})" >&2
            exit 3
          fi
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"

      - name: Run trusted preflight verifier
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ ! -f "tools/autoloop/cli.py" ]; then
            echo "Bootstrap rollout detected: tools/autoloop/cli.py is absent on ${DEFAULT_BRANCH}."
            if [ "${PR_AUTHOR}" != "Morris-Zin" ]; then
              echo "ERROR: first-deployment bootstrap PR must be opened by a trusted owner (got ${PR_AUTHOR})." >&2
              exit 3
            fi
            TMP_CANDIDATE="$(mktemp -d)"
            trap 'git worktree remove --force "${TMP_CANDIDATE}" >/dev/null 2>&1 || rm -rf "${TMP_CANDIDATE}"' EXIT
            git worktree add --detach "${TMP_CANDIDATE}" "${HEAD_SHA}"
            (
              cd "${TMP_CANDIDATE}"
              python -B -m unittest discover -s tools -p "test_*.py"
              python tools/autoloop/cli.py lint
            )
            echo "enrolled=false" >> "$GITHUB_OUTPUT"
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
            echo "run_id=" >> "$GITHUB_OUTPUT"
            echo "code_tree_sha256=" >> "$GITHUB_OUTPUT"
            echo "shard_checks_b64=W10=" >> "$GITHUB_OUTPUT"
            echo "shard_checks_sha256=4f53cda18c2baa0c0354bb5f9a3ecbe5ed12ab4d8e11ba873c2f11161202b945" >> "$GITHUB_OUTPUT"
            echo "verdict=bootstrap-rollout"
            exit 0
          fi

          python -B tools/autoloop/cli.py verify-pr-integrity \
            --mode preflight \
            --event-path "${GITHUB_EVENT_PATH}" \
            --repo-slug "${{ github.repository }}" \
            --main-ref "origin/${DEFAULT_BRANCH}" \
            --github-output "${GITHUB_OUTPUT}"

  autoloop-candidate-checks:
    name: autoloop-candidate-checks
    needs: autoloop-preflight
    if: needs.autoloop-preflight.outputs.enrolled == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Checkout candidate PR head for fast-check
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Warm pinned Knip cache
        run: npx --yes knip@6.46.1 --version

      - name: Run candidate fast-check (isolated VM)
        env:
          AUTOLOOP_PINNED_KNIP: "6.46.1"
        run: |
          set -euo pipefail
          env -u GITHUB_OUTPUT -u GITHUB_ENV -u GITHUB_PATH -u GITHUB_STEP_SUMMARY \
            python -B tools/khitmee_dev.py fast-check

  autoloop-shard-checks:
    name: autoloop-shard-checks
    needs: autoloop-preflight
    if: needs.autoloop-preflight.outputs.enrolled == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      trusted_shard_results_b64: ${{ steps.shard_harness.outputs.trusted_shard_results_b64 }}
    steps:
      - name: Checkout fresh candidate PR head in isolated runner VM
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate-repo
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify committed tree hash and execute FrozenContractV1 shard checks
        id: shard_harness
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ needs.autoloop-preflight.outputs.run_id }}
          SHARD_CHECKS_B64: ${{ needs.autoloop-preflight.outputs.shard_checks_b64 }}
          EXPECTED_SHARD_CHECKS_SHA256: ${{ needs.autoloop-preflight.outputs.shard_checks_sha256 }}
          CODE_TREE_SHA256: ${{ needs.autoloop-preflight.outputs.code_tree_sha256 }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, os, re, shutil, subprocess, sys, tempfile

          head_sha = (os.environ.get("HEAD_SHA") or "").strip()
          run_id = (os.environ.get("RUN_ID") or "").strip()
          raw_b64 = (os.environ.get("SHARD_CHECKS_B64") or "").strip()
          expected_sha = (os.environ.get("EXPECTED_SHARD_CHECKS_SHA256") or "").strip()
          expected_tree_sha = (os.environ.get("CODE_TREE_SHA256") or "").strip()
          gh_out = os.environ.get("GITHUB_OUTPUT") or ""

          if not (head_sha and run_id and raw_b64 and expected_sha and expected_tree_sha):
              print("ERROR: missing required preflight shard manifest outputs", file=sys.stderr)
              sys.exit(3)

          manifest_bytes = base64.b64decode(raw_b64)
          actual_sha = hashlib.sha256(manifest_bytes).hexdigest()
          if actual_sha != expected_sha:
              print(f"ERROR: shard manifest sha256 mismatch ({actual_sha} != {expected_sha})", file=sys.stderr)
              sys.exit(3)

          payload = json.loads(manifest_bytes.decode("utf-8"))
          if not isinstance(payload, list) or not payload:
              print("ERROR: frozen shard checks manifest must be a non-empty list", file=sys.stderr)
              sys.exit(3)

          actual_head = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], cwd="candidate-repo", text=True
          ).strip()
          if actual_head != head_sha:
              print(f"ERROR: candidate checkout HEAD {actual_head} != expected {head_sha}", file=sys.stderr)
              sys.exit(3)

          # Independently recompute code_tree_sha256 from candidate-repo Git tree before running any shard
          slug_re = re.compile(r"^[a-z0-9][a-z0-9-]{0,63}$")
          def is_meta(p: str) -> bool:
              if p == f".autoloop/runs/{run_id}.json":
                  return True
              prefix = f".autoloop/experiments/{run_id}-"
              if p.startswith(prefix) and p.endswith(".md"):
                  slug = p[len(prefix):-3]
                  return "/" not in slug and bool(slug_re.match(slug))
              return False

          raw_tree = subprocess.check_output(
              ["git", "ls-tree", "-r", "-z", head_sha], cwd="candidate-repo"
          )
          entries = []
          for chunk in raw_tree.split(b"\0"):
              if not chunk:
                  continue
              meta, path_b = chunk.split(b"\t", 1)
              mode, obj_type, sha = meta.decode("ascii").split(" ")
              path_s = path_b.decode("utf-8", errors="surrogateescape")
              entries.append((mode, obj_type, sha, path_s))
          entries.sort(key=lambda e: e[3].encode("utf-8"))
          hasher = hashlib.sha256()
          for mode, obj_type, sha, path_s in entries:
              if is_meta(path_s):
                  continue
              hasher.update(f"{mode} {obj_type} {sha}\t{path_s}\0".encode("utf-8"))
          computed_tree_sha = hasher.hexdigest()
          if computed_tree_sha != expected_tree_sha:
              print(
                  f"ERROR: computed code_tree_sha256 ({computed_tree_sha}) != preflight ({expected_tree_sha})",
                  file=sys.stderr,
              )
              sys.exit(3)

          child_env = {
              k: v
              for k, v in os.environ.items()
              if k not in ("GITHUB_OUTPUT", "GITHUB_ENV", "GITHUB_PATH", "GITHUB_STEP_SUMMARY")
          }
          passed_shards = {}
          for item in payload:
              sid = str(item.get("shard_id") or "").strip()
              if not sid:
                  print("ERROR: shard manifest item missing shard_id", file=sys.stderr)
                  sys.exit(3)
              # Execute each shard in its own fresh detached worktree so shards cannot tamper with each other
              wt_dir = tempfile.mkdtemp(prefix=f"autoloop-shard-{sid}-")
              try:
                  subprocess.run(
                      ["git", "worktree", "add", "--detach", wt_dir, head_sha],
                      cwd="candidate-repo",
                      check=True,
                  )
                  for cmd in item.get("checks") or []:
                      print(f"Running frozen shard check [{sid}]: {cmd}")
                      subprocess.run(cmd, shell=True, cwd=wt_dir, env=child_env, check=True)
                  passed_shards[sid] = computed_tree_sha
              finally:
                  subprocess.run(
                      ["git", "worktree", "remove", "--force", wt_dir],
                      cwd="candidate-repo",
                      capture_output=True,
                  )
                  shutil.rmtree(wt_dir, ignore_errors=True)

          att_b64 = base64.b64encode(
              json.dumps(passed_shards, sort_keys=True, separators=(",", ":")).encode("utf-8")
          ).decode("ascii")
          with open(gh_out, "a", encoding="utf-8", newline="\n") as fh:
              fh.write(f"trusted_shard_results_b64={att_b64}\n")
          PY

  autoloop-integrity:
    name: autoloop-integrity
    needs:
      - autoloop-preflight
      - autoloop-candidate-checks
      - autoloop-shard-checks
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Require preflight success
        env:
          PREFLIGHT_RESULT: ${{ needs.autoloop-preflight.result }}
        run: |
          if [ "${PREFLIGHT_RESULT}" != "success" ]; then
            echo "ERROR: autoloop-preflight did not succeed (${PREFLIGHT_RESULT})." >&2
            exit 3
          fi

      - name: Checkout trusted default branch
        if: needs.autoloop-preflight.outputs.bootstrap != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        if: needs.autoloop-preflight.outputs.bootstrap != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch PR base, main, and PR head ref
        if: needs.autoloop-preflight.outputs.bootstrap != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" fetch --no-tags origin \
            "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}" \
            "${BASE_SHA}" \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr-${PR_NUMBER}-head"
          ACTUAL_HEAD="$(git rev-parse "refs/remotes/origin/pr-${PR_NUMBER}-head")"
          if [ "${ACTUAL_HEAD}" != "${HEAD_SHA}" ]; then
            echo "ERROR: refs/pull/${PR_NUMBER}/head (${ACTUAL_HEAD}) != event head.sha (${HEAD_SHA})" >&2
            exit 3
          fi
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"

      - name: Finalize trusted integrity verification
        if: needs.autoloop-preflight.outputs.bootstrap != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ENROLLED: ${{ needs.autoloop-preflight.outputs.enrolled }}
          CANDIDATE_CHECKS_RESULT: ${{ needs.autoloop-candidate-checks.result }}
          SHARD_CHECKS_RESULT: ${{ needs.autoloop-shard-checks.result }}
          TRUSTED_SHARD_RESULTS_B64: ${{ needs.autoloop-shard-checks.outputs.trusted_shard_results_b64 }}
        run: |
          set -euo pipefail
          if [ "${ENROLLED}" = "true" ] && [ "${SHARD_CHECKS_RESULT}" != "success" ]; then
            echo "ERROR: autoloop-shard-checks did not succeed (${SHARD_CHECKS_RESULT})." >&2
            exit 3
          fi
          EXTRA_ARGS=()
          if [ -n "${TRUSTED_SHARD_RESULTS_B64}" ]; then
            EXTRA_ARGS+=(--trusted-shard-results-b64 "${TRUSTED_SHARD_RESULTS_B64}")
          fi
          python -B tools/autoloop/cli.py verify-pr-integrity \
            --mode finalize \
            --candidate-checks-result "${CANDIDATE_CHECKS_RESULT}" \
            "${EXTRA_ARGS[@]}" \
            --event-path "${GITHUB_EVENT_PATH}" \
            --repo-slug "${{ github.repository }}" \
            --main-ref "origin/${DEFAULT_BRANCH}"
