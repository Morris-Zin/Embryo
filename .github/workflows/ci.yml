name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-gate:
    name: Offline fast-check gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: apps/khitmee_ops/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/khitmee_ops/package.json

      - name: Install pinned Python dev tools
        run: python -m pip install --group apps/khitmee_ops/pyproject.toml:dev

      - name: Warm knip cache
        working-directory: apps/khitmee_ops
        run: npx --yes knip@6.46.1 --version

      - name: Run offline fast-check gate
        run: python tools/khitmee_dev.py fast-check
