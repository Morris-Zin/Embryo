name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-gate:
    name: Offline fast-check gate
    runs-on: ubuntu-latest
    steps:
      # Enrolled autoloop PRs already run this exact gate in the more restrictive
      # autoloop-candidate-checks job; skip the duplicate setup and test work here.
      - name: Detect whether this independent gate is required
        id: gate
        run: |
          python3 - <<'PY'
          import json
          import os

          required = True
          if os.environ.get("GITHUB_EVENT_NAME") == "pull_request":
              with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as event_file:
                  event = json.load(event_file)
              labels = (event.get("pull_request") or {}).get("labels") or []
              required = not any(label.get("name") == "autoloop" for label in labels)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"required={str(required).lower()}\n")
          PY

      - name: Check out repository
        if: steps.gate.outputs.required == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.14
        if: steps.gate.outputs.required == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: apps/khitmee_ops/pyproject.toml

      - name: Set up Node.js
        if: steps.gate.outputs.required == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/khitmee_ops/package.json

      - name: Install pinned Python dev tools
        if: steps.gate.outputs.required == 'true'
        run: python -m pip install --group apps/khitmee_ops/pyproject.toml:dev

      - name: Warm knip cache
        if: steps.gate.outputs.required == 'true'
        working-directory: apps/khitmee_ops
        run: npx --yes knip@6.46.1 --version

      - name: Run offline fast-check gate
        if: steps.gate.outputs.required == 'true'
        run: python tools/khitmee_dev.py fast-check
