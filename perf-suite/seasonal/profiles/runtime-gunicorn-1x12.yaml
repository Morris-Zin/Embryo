# Hard 2 vCPU total cap layered over perf-suite/docker/profile-2gb.yaml.
# Memory caps come from that profile; configurator is capped here so all nine
# compose services total exactly 2048 MiB.
services:
  configurator:
    mem_limit: 48m
    cpus: 0.05
  db:
    cpus: 0.70
  backend:
    cpus: 0.75
  queue:
    cpus: 0.15
  scheduler:
    cpus: 0.05
  redis-cache:
    cpus: 0.05
  redis-queue:
    cpus: 0.05
  websocket:
    cpus: 0.05
  frontend:
    cpus: 0.15
