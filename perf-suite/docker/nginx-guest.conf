worker_processes 1;
worker_cpu_affinity auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 1024;
	multi_accept on;
}

http {
	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	keepalive_requests 1000;
	types_hash_max_size 2048;
	server_tokens off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers off;

	log_format adr4_upstream '$remote_addr - $remote_user [$time_local] "$request" '
		'status=$status rt=$request_time '
		'uct=$upstream_connect_time uht=$upstream_header_time urt=$upstream_response_time '
		'upstream_name=$upstream_pool upstream_addr=$upstream_addr '
		'method=$request_method uri=$uri bytes=$body_bytes_sent';
	access_log /var/log/nginx/access.log adr4_upstream;

	gzip on;

	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;
}
