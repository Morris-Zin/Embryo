# ADR-0004 whole-guest 2 vCPU / 2 GiB emulation profile.
# Every service shares the parent systemd slice khitmeeperf.slice. Children
# have no hard CPU quota; cpu_shares values are the Docker/runc inputs that
# convert to the ADR cgroup-v2 cpu.weight values under runc >= 1.3.2.
# Memory limits are per-service safety ceilings from ADR-0004; the parent slice
# remains the authoritative whole-guest memory boundary.
services:
  configurator:
    cgroup_parent: khitmeeperf.slice
    mem_limit: 64m
    cpu_shares: 1024

  db:
    cgroup_parent: khitmeeperf.slice
    mem_limit: 544m
    cpu_shares: 4050
    environment:
      LD_PRELOAD: /usr/lib/x86_64-linux-gnu/libjemalloc.so.2
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --innodb-snapshot-isolation=OFF
      - --innodb-buffer-pool-size=320M
      - --innodb-log-file-size=128M
      - --innodb-buffer-pool-dump-pct=100
      - --innodb-buffer-pool-load-at-startup=ON
      - --innodb-buffer-pool-dump-at-shutdown=ON
      - --innodb-io-capacity=1000
      - --innodb-io-capacity-max=2000
      - --innodb-log-buffer-size=16M
      - --aria-pagecache-buffer-size=8M
      - --key-buffer-size=1M
      - --innodb-flush-log-at-trx-commit=1
      - --innodb-flush-method=O_DIRECT
      - --max-connections=32
      - --thread-cache-size=16
      - --table-open-cache=400
      - --table-definition-cache=400
      - --tmp-table-size=16M
      - --max-heap-table-size=16M
      - --sort-buffer-size=1M
      - --join-buffer-size=256K
      - --innodb-lock-wait-timeout=20
      - --performance-schema=OFF
      - --slow-query-log=ON
      - --log-slow-query-file=/var/lib/mysql/mariadb-slow.log
      - --long-query-time=1

  # ADR-0004 general pool: manager, login and general Desk traffic.
  backend:
    cgroup_parent: khitmeeperf.slice
    mem_limit: 224m
    cpu_shares: 1024
    environment:
      MALLOC_ARENA_MAX: "2"
      MALLOC_MMAP_THRESHOLD_: "1048576"
      MALLOC_TRIM_THRESHOLD_: "8388608"
    command:
      - /home/frappe/frappe-bench/env/bin/gunicorn
      - --chdir=/home/frappe/frappe-bench/sites
      - --bind=0.0.0.0:8000
      - --workers=${GENERAL_GUNICORN_WORKERS:-1}
      - --worker-class=sync
      - --worker-tmp-dir=/dev/shm
      - --timeout=120
      - --keep-alive=65
      - --preload
      - --max-requests=1500
      - --max-requests-jitter=300
      - frappe.app:application

  # ADR-0004 cashier pool: one preloaded gthread worker with three threads.
  cashier:
    image: ${CUSTOM_IMAGE:-frappe/erpnext}:${CUSTOM_TAG:-v16.60.0}
    pull_policy: ${PULL_POLICY:-missing}
    restart: ${RESTART_POLICY:-unless-stopped}
    platform: linux/amd64
    cgroup_parent: khitmeeperf.slice
    mem_limit: 416m
    cpu_shares: 4050
    environment:
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1,::1}
      MALLOC_ARENA_MAX: "2"
      MALLOC_MMAP_THRESHOLD_: "1048576"
      MALLOC_TRIM_THRESHOLD_: "8388608"
    command:
      - /home/frappe/frappe-bench/env/bin/gunicorn
      - --chdir=/home/frappe/frappe-bench/sites
      - --bind=0.0.0.0:8000
      - --threads=${CASHIER_GUNICORN_THREADS:-3}
      - --workers=${CASHIER_GUNICORN_WORKERS:-1}
      - --worker-class=gthread
      - --worker-tmp-dir=/dev/shm
      - --timeout=120
      - --keep-alive=65
      - --preload
      - --max-requests=1500
      - --max-requests-jitter=300
      - frappe.app:application
    volumes:
      - perf-sites:/home/frappe/frappe-bench/sites
    depends_on:
      configurator:
        condition: service_completed_successfully

  queue:
    image: ${CUSTOM_IMAGE:-frappe/erpnext}:${CUSTOM_TAG:-v16.60.0}
    pull_policy: ${PULL_POLICY:-missing}
    restart: ${RESTART_POLICY:-unless-stopped}
    platform: linux/amd64
    cgroup_parent: khitmeeperf.slice
    mem_limit: 256m
    cpu_shares: 416
    environment:
      MALLOC_ARENA_MAX: "2"
    command:
      - bench
      - worker
      - --queue
      - short,default,long
    volumes:
      - perf-sites:/home/frappe/frappe-bench/sites
    depends_on:
      configurator:
        condition: service_completed_successfully

  scheduler:
    cgroup_parent: khitmeeperf.slice
    mem_limit: 96m
    cpu_shares: 212

  redis-cache:
    cgroup_parent: khitmeeperf.slice
    mem_limit: 64m
    cpu_shares: 1703
    command:
      - redis-server
      - --maxmemory
      - 32mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --tcp-keepalive
      - "60"

  redis-queue:
    cgroup_parent: khitmeeperf.slice
    mem_limit: 32m
    cpu_shares: 1284
    command:
      - redis-server
      - --maxmemory
      - 16mb
      - --maxmemory-policy
      - noeviction
      - --tcp-keepalive
      - "60"

  websocket:
    cgroup_parent: khitmeeperf.slice
    mem_limit: 72m
    cpu_shares: 311
    environment:
      NODE_OPTIONS: "--max-old-space-size=56"

  frontend:
    cgroup_parent: khitmeeperf.slice
    mem_limit: 24m
    cpu_shares: 1024
    depends_on:
      - backend
      - cashier
      - websocket
    volumes:
      - ./nginx-guest.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-frappe-guest.conf.template:/templates/nginx/frappe.conf.template:ro
