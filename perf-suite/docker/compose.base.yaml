name: khitmee-perf

x-customizable-image: &customizable_image
  image: ${CUSTOM_IMAGE:-frappe/erpnext}:${CUSTOM_TAG:-v16.60.0}
  pull_policy: ${PULL_POLICY:-missing}
  restart: ${RESTART_POLICY:-unless-stopped}

x-depends-on-configurator: &depends_on_configurator
  depends_on:
    configurator:
      condition: service_completed_successfully

x-backend-defaults: &backend_defaults
  <<: [*depends_on_configurator, *customizable_image]
  platform: linux/amd64
  volumes:
    - perf-sites:/home/frappe/frappe-bench/sites

services:
  configurator:
    <<: *customizable_image
    platform: linux/amd64
    entrypoint:
      - bash
      - -c
    command:
      - >
        set -euo pipefail;
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started
    restart: on-failure
    volumes:
      - perf-sites:/home/frappe/frappe-bench/sites

  db:
    image: mariadb:11.8
    pull_policy: ${PULL_POLICY:-missing}
    restart: ${RESTART_POLICY:-unless-stopped}
    platform: linux/amd64
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 12
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --innodb-snapshot-isolation=OFF
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD_REQUIRED}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - perf-db-data:/var/lib/mysql

  redis-cache:
    image: redis:8.6-alpine
    pull_policy: ${PULL_POLICY:-missing}
    restart: ${RESTART_POLICY:-unless-stopped}
    platform: linux/amd64

  redis-queue:
    image: redis:8.6-alpine
    pull_policy: ${PULL_POLICY:-missing}
    restart: ${RESTART_POLICY:-unless-stopped}
    platform: linux/amd64
    volumes:
      - perf-redis-queue-data:/data

  backend:
    <<: *backend_defaults
    environment:
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1,::1}
    command:
      - /home/frappe/frappe-bench/env/bin/gunicorn
      - --chdir=/home/frappe/frappe-bench/sites
      - --bind=0.0.0.0:8000
      - --threads=4
      - --workers=1
      - --worker-class=gthread
      - --worker-tmp-dir=/dev/shm
      - --timeout=120
      - --keep-alive=65
      - --preload
      - --max-requests=1500
      - --max-requests-jitter=300
      - frappe.app:application

  websocket:
    <<: *backend_defaults
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js

  scheduler:
    <<: *backend_defaults
    command:
      - bench
      - schedule

  frontend:
    <<: *customizable_image
    platform: linux/amd64
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      NGINX_LISTEN_PORT: "8080"
      TRUST_UPSTREAM_FORWARDED_PROTO: ${TRUST_UPSTREAM_FORWARDED_PROTO:-off}
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME:-bench-loadtest.localhost}
      UPSTREAM_REAL_IP_ADDRESS: ${UPSTREAM_REAL_IP_ADDRESS:-127.0.0.1}
      UPSTREAM_REAL_IP_HEADER: ${UPSTREAM_REAL_IP_HEADER:-X-Forwarded-For}
      UPSTREAM_REAL_IP_RECURSIVE: ${UPSTREAM_REAL_IP_RECURSIVE:-off}
      PROXY_READ_TIMEOUT: ${PROXY_READ_TIMEOUT:-120}
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-50m}
    ports:
      - "127.0.0.1:18086:8080"
    volumes:
      - perf-sites:/home/frappe/frappe-bench/sites
      - ./nginx-frappe.conf.template:/templates/nginx/frappe.conf.template:ro
    depends_on:
      - backend
      - websocket

volumes:
  perf-db-data:
    name: perf-db-data
  perf-sites:
    name: perf-sites
  perf-redis-queue-data:
    name: perf-redis-queue-data
