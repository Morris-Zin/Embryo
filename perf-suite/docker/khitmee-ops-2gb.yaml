services:
  configurator:
    environment:
      PYTHONPATH: /home/frappe/frappe-bench/apps/khitmee_ops
    volumes:
      - /srv/khitmee-perf/apps/khitmee_ops:/home/frappe/frappe-bench/apps/khitmee_ops:rw

  backend:
    environment:
      PYTHONPATH: /home/frappe/frappe-bench/apps/khitmee_ops
    command:
      - /home/frappe/frappe-bench/env/bin/gunicorn
      - --chdir=/home/frappe/frappe-bench/sites
      - --bind=0.0.0.0:8000
      - --threads=4
      - --workers=1
      - --worker-class=gthread
      - --worker-tmp-dir=/dev/shm
      - --timeout=120
      - --keep-alive=65
      - --preload
      - --max-requests=1500
      - --max-requests-jitter=300
      - khitmee_ops.preload_wsgi:application
    volumes:
      - /srv/khitmee-perf/apps/khitmee_ops:/home/frappe/frappe-bench/apps/khitmee_ops:rw

  queue:
    environment:
      PYTHONPATH: /home/frappe/frappe-bench/apps/khitmee_ops
    volumes:
      - /srv/khitmee-perf/apps/khitmee_ops:/home/frappe/frappe-bench/apps/khitmee_ops:rw

  scheduler:
    environment:
      PYTHONPATH: /home/frappe/frappe-bench/apps/khitmee_ops
    volumes:
      - /srv/khitmee-perf/apps/khitmee_ops:/home/frappe/frappe-bench/apps/khitmee_ops:rw

  websocket:
    volumes:
      - /srv/khitmee-perf/apps/khitmee_ops:/home/frappe/frappe-bench/apps/khitmee_ops:rw

  frontend:
    volumes:
      - /srv/khitmee-perf/apps/khitmee_ops:/home/frappe/frappe-bench/apps/khitmee_ops:ro
