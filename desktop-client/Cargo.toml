[package]
name = "khitmee-catalog-service"
version = "0.1.0"
edition = "2021"
description = "Experimental encrypted local catalog service for the Khitmee ERPNext counter"
license = "MIT"

[dependencies]
tiny_http = "0.12.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
rusqlite = { version = "0.43.0", features = ["bundled-sqlcipher"] }
getrandom = "0.2.15"
url = "2.5.4"
memchr = "2.7.4"

[target.'cfg(target_os = "windows")'.dependencies]
windows-dpapi = "0.2.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
