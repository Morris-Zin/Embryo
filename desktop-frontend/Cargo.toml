[workspace]
members = [
    "crates/khitmee-catalog",
    "crates/khitmee-erp",
    "crates/migration-core",
    "crates/khitmee-desktop",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
rusqlite = { version = "0.43.0", features = ["bundled-sqlcipher"] }
getrandom = "0.2.15"
memchr = "2.7.4"
rayon = "1.12.0"
libc = "0.2.191"
slint = { version = "1.19.1", default-features = false, features = ["std", "backend-default", "renderer-software", "accessibility", "compat-1-2"] }
slint-build = "1.19.1"
proptest = "1.6.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
